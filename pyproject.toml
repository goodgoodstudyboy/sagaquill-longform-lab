[project]
name = "sagaquill"
version = "0.7.4"
description = "A self-reviewing multi-stage novel generation pipeline powered by Codex config and auth."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]

[project.scripts]
sagaquill = "sagaquill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sagaquill"]
